<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Cinéphile IA</title>
    <!-- Importation d'une police moderne (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #e50914; /* Rouge cinéma / Netflix */
            --accent-color: #f5c518; /* Jaune IMDb / cinéma */
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-shadow: 0 2px 10px rgba(229, 9, 20, 0.3);
        }

        h1 span {
            color: var(--accent-color);
        }

        .search-container {
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15);
        }

        button {
            padding: 16px 28px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #b80710;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        .results-section {
            animation: fadeIn 0.5s ease-out;
        }

        h2 {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-box {
            background: var(--surface-color);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            white-space: pre-wrap;
            line-height: 1.8;
            color: #f1f1f1;
            font-size: 1.05rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design pour mobiles */
        @media (max-width: 600px) {
            form {
                flex-direction: column;
            }
            h1 {
                font-size: 1.8rem;
            }
            body {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Assistant <span>Cinéphile</span> IA</h1>
    </header>

    <div class="search-container">
        <form method="POST">
            <input type="text" name="query" value="{{ query }}" placeholder="Que recherchez-vous ? (ex: un chef-d'œuvre de sci-fi)" required>
            <button type="submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Rechercher
            </button>
        </form>
    </div>

    {% if answer %}
        <div class="results-section">
            <h2>✨ Recommandations pour vous :</h2>
            <div class="result-box">{{ answer }}</div>
        </div>
    {% endif %}

</body>
</html>
